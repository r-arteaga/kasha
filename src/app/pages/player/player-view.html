<ng-container *transloco="let t">
  @if (readingKind() && !allReadings.error()) {
    <!-- Svet's buttons at the top of "Pantalla II": each shows or hides one layer over the text. -->
    <div class="layers">
      <button
        type="button"
        class="layer"
        [class.on]="showReadings.on()"
        [attr.aria-pressed]="showReadings.on()"
        (click)="showReadings.toggle()"
      >
        <tui-icon [icon]="showReadings.on() ? '@tui.eye' : '@tui.eye-off'" />
        {{ t(readingKind() === 'pinyin' ? 'player.pinyin' : 'player.romanization') }}
      </button>
    </div>
  }
  <main class="reading">
    <k-karaoke-text
      [sentences]="track().sentences"
      [position]="player.position()"
      [locale]="track().locale"
      [follow]="player.playing()"
      [readings]="readings()"
      (wordTap)="player.tapAt($event)"
    />
  </main>

  <footer class="dock">
    @if (player.turn(); as turn) {
      <div class="turn" role="status" aria-live="polite">
        <tui-icon icon="@tui.mic" class="turn-icon" />
        <span class="turn-text">{{ t('player.yourTurn') }}</span>
        <span class="turn-bar" aria-hidden="true" [style.animation-duration.ms]="turn.ms"></span>
      </div>
    }
    <div class="track-line" aria-hidden="true">
      <div class="track-fill" [style.transform]="'scaleX(' + player.progress() + ')'"></div>
    </div>
    <div class="practice">
      <button
        tuiIconButton
        type="button"
        size="m"
        iconStart="@tui.repeat-1"
        [appearance]="player.repeat() ? 'primary' : 'secondary'"
        [attr.aria-pressed]="player.repeat()"
        (click)="player.toggleRepeat()"
      >
        {{ t('player.repeat') }}
      </button>
      <button
        tuiIconButton
        type="button"
        size="m"
        iconStart="@tui.mic"
        [appearance]="player.pauseToRepeat() ? 'primary' : 'secondary'"
        [attr.aria-pressed]="player.pauseToRepeat()"
        (click)="player.setPauseToRepeat(!player.pauseToRepeat())"
      >
        {{ t('player.pauseToRepeat') }}
      </button>
      <span class="time">
        <span>{{ elapsed() }}</span>
        <span class="time-total"> / {{ total() }}</span>
      </span>
    </div>
    <div class="controls">
      <div class="side start">
        <ng-content />
      </div>
      <button
        tuiIconButton
        type="button"
        size="l"
        class="play"
        [iconStart]="player.active() ? '@tui.pause' : '@tui.play'"
        (click)="player.toggle()"
      >
        {{ t(player.active() ? 'player.pause' : 'player.play') }}
      </button>
      <div class="side end">
        <!-- Only the snail: Svet, "es un símbolo reconocido de lento". Its name stays for VoiceOver. -->
        <button
          tuiIconButton
          type="button"
          size="m"
          iconStart="@tui.snail"
          [appearance]="slow() ? 'primary' : 'secondary'"
          [attr.aria-pressed]="slow()"
          (click)="toggleSlow()"
        >
          {{ t('player.slow') }}
        </button>
      </div>
    </div>
  </footer>
</ng-container>
