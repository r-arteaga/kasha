<ng-container *transloco="let t">
  <div class="backdrop" aria-hidden="true" (click)="closed.emit()"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="save-sheet-title">
    <h2 class="title" id="save-sheet-title">{{ t(title()) }}</h2>

    <div class="options" role="radiogroup">
      <label class="option">
        <input type="radio" name="lesson" class="radio" [checked]="choice() === ''" (change)="pick('')" />
        <tui-icon class="option-icon" [icon]="mode() === 'moveFolder' ? '@tui.folder-tree' : '@tui.audio-lines'" />
        <span class="option-label">{{ t(topLabel()) }}</span>
        @if (choice() === '') {
          <tui-icon class="option-check" icon="@tui.check" />
        }
      </label>
      @for (option of options(); track option.folder.id) {
        <label class="option" [style.padding-inline-start.rem]="1 + option.depth * 1.25">
          <input
            type="radio"
            name="lesson"
            class="radio"
            [checked]="choice() === option.folder.id"
            (change)="pick(option.folder.id)"
          />
          <tui-icon class="option-icon" icon="@tui.folder" />
          <span class="option-label">{{ option.folder.title || t('save.untitled') }}</span>
          @if (choice() === option.folder.id) {
            <tui-icon class="option-check" icon="@tui.check" />
          }
        </label>
      }
      <label class="option">
        <input type="radio" name="lesson" class="radio" [checked]="isNew()" (change)="pick('new')" />
        <tui-icon class="option-icon" icon="@tui.folder-plus" />
        <span class="option-label">{{ t('save.newLesson') }}</span>
        @if (isNew()) {
          <tui-icon class="option-check" icon="@tui.check" />
        }
      </label>
    </div>

    @if (isNew()) {
      <input
        class="name"
        type="text"
        enterkeyhint="done"
        [attr.aria-label]="t('save.newLessonName')"
        [placeholder]="t('save.newLessonName')"
        [value]="newTitle()"
        (input)="name($event)"
        (keydown.enter)="confirm()"
      />
    }

    @if (failed() || createFailed()) {
      <p tuiNotification appearance="negative" size="s" role="alert">{{ t('save.failed') }}</p>
    }

    <div class="actions">
      <button tuiButton type="button" appearance="secondary" size="m" (click)="closed.emit()">
        {{ t('save.cancel') }}
      </button>
      <button tuiButton type="button" size="m" [disabled]="!canConfirm()" (click)="confirm()">
        {{ t('save.confirm') }}
      </button>
    </div>
  </section>
</ng-container>
